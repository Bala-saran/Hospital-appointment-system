<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="doctorLoginPage">
<header>
    <h1>City Care Hospital - Doctor</h1>
    <nav><a class="navBtn" href="index.html">Home</a></nav>
</header>
<a class="backBtn" href="javascript:history.back()">&larr; Back</a>
<main class="loginMain">
    <div class="card loginCard">
        <h2>Doctor Login</h2>
        <form action="/doctor/login" method="POST">
            <input type="text" name="username" placeholder="Username or email" oninput="this.value=this.value.replace(/\s/g, '')" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</main>
</body>
</html>
